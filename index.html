<style>
:root{
  --bg:#FDF5F6; --card:#FBEAEE; --line:#F0CDD5; --ink:#2A1D21; --sub:#6E5A60;
  --accent:#C8344F; --accent-ink:#FFFFFF; --soft:#E296A7; --chip:#FFFFFF;
  --yellow:#9A6A00; --red:#B3261E; --good:#2E7D5B; --nav:#FFFFFF; color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1417; --card:#2A1E22; --line:#4A3239; --ink:#F7ECEE; --sub:#C3AAB1;
    --accent:#E2577A; --accent-ink:#1C1417; --soft:#7A3E4D; --chip:#231A1D;
    --yellow:#F0B35A; --red:#FF8A80; --good:#6FCB9F; --nav:#20171A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1417; --card:#2A1E22; --line:#4A3239; --ink:#F7ECEE; --sub:#C3AAB1;
  --accent:#E2577A; --accent-ink:#1C1417; --soft:#7A3E4D; --chip:#231A1D;
  --yellow:#F0B35A; --red:#FF8A80; --good:#6FCB9F; --nav:#20171A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
main{max-width:500px;margin:0 auto;padding:28px 22px 120px}
body.full main{padding-bottom:40px}
h1{font-size:2rem;line-height:1.25;margin:8px 0 6px;font-weight:700;letter-spacing:-.02em}
h2{font-size:1.1rem;margin:0 0 10px;line-height:1.4}
.lead{color:var(--sub);font-size:1.02rem;margin:0 0 24px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:26px;padding:22px;margin-bottom:16px}
.label{color:var(--sub);font-size:.9rem;margin:0 0 6px}
.mission{font-weight:700;font-size:1.12rem;line-height:1.55;margin:0 0 14px}
.row{display:flex;gap:8px}
.pill{flex:1 1 0;min-width:0;min-height:50px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--chip);color:var(--ink);font:inherit;font-weight:600;font-size:.95rem;cursor:pointer;padding:8px}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:999px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:.9rem;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
textarea,input[type=text]{width:100%;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);
  border-radius:18px;padding:12px 16px;font:inherit;font-size:1rem;resize:vertical}
textarea.big{min-height:170px;background:var(--card);border-radius:26px;padding:20px 22px;font-size:1.04rem}
textarea::placeholder,input::placeholder{color:var(--sub)}
.btn{display:block;width:100%;min-height:56px;border-radius:999px;border:0;font:inherit;font-weight:700;font-size:1.06rem;cursor:pointer;margin-top:12px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{background:var(--soft);opacity:.75;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{min-height:46px;font-size:.95rem;margin-top:8px}
.btn.ghost[data-on="true"]{border-color:var(--accent);color:var(--accent)}
.link{background:none;border:0;color:var(--sub);font:inherit;font-size:.92rem;cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:3px}
.link.accent{color:var(--accent);text-decoration:none;font-weight:600}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.center{text-align:center}
.situation{color:var(--sub);border-left:3px solid var(--line);padding:2px 0 2px 14px;margin:0 0 22px}
.inner{margin:0 0 4px;padding-left:20px}
.swap{background:var(--chip);border-radius:18px;padding:14px 16px;margin-top:14px}
.swap .old{color:var(--sub);margin:0;text-decoration:line-through;text-decoration-thickness:1px}
.swap .new{font-weight:700;margin:4px 0 0}
.swap .new::before{content:"→ ";color:var(--accent)}
.notice{border-radius:16px;padding:12px 14px;margin-top:14px;font-size:.93rem;background:var(--chip);border:1.5px solid var(--line)}
.notice.yellow{border-color:var(--yellow)} .notice.red{border-color:var(--red)}
.notice b{display:block}
.notice.yellow b{color:var(--yellow)} .notice.red b{color:var(--red)}
details{margin-top:14px}
summary{cursor:pointer;color:var(--sub);font-size:.9rem}
details p{margin:8px 0 0;font-size:.93rem}
.call{display:flex;justify-content:space-between;align-items:center;text-decoration:none;color:var(--ink);
  background:var(--chip);border:1.5px solid var(--line);border-radius:16px;padding:13px 16px;margin-top:8px;font-weight:600}
.call span:last-child{color:var(--red);font-weight:700}
.loading{color:var(--sub);display:flex;align-items:center;gap:10px;padding:30px 0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite ease-in-out}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.dot{animation:none}}
.nudge{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);margin-top:22px;font-size:.93rem}
.season{background:transparent;border-style:dashed}
.manual li{margin-bottom:8px}
.manual li.hard{color:var(--sub)}
.progress{height:8px;border-radius:999px;background:var(--chip);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.progress span{display:block;height:100%;background:var(--accent)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:12px}
.stat b{display:block;font-size:1.6rem;color:var(--accent);line-height:1.2}
.stat span{font-size:.78rem;color:var(--sub)}
.seg{display:flex;border-bottom:1.5px solid var(--line);margin:8px 0 6px}
.seg button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-weight:600;padding:10px 4px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.rec{border-bottom:1px solid var(--line);padding:14px 0}
.rec:last-child{border-bottom:0}
.date{color:var(--sub);font-size:.8rem;margin:0}
.rec p{margin:2px 0}
.tag{display:inline-block;font-size:.8rem;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--chip);border:1px solid var(--line);margin:4px 6px 0 0}
.tag.red{color:var(--red)}
.mood{display:flex;gap:6px;margin:6px 0 2px}
.mood button{flex:1;min-height:44px;border-radius:14px;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.mood button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.scale{display:flex;justify-content:space-between;color:var(--sub);font-size:.78rem}
.q{padding:12px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q p{margin:0 0 6px}
.counter{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.counter .ctl{display:flex;align-items:center;gap:12px}
.counter button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-size:1.2rem;cursor:pointer}
.counter b{min-width:22px;text-align:center;font-size:1.15rem}
.log{font-size:.83rem;max-height:240px;overflow:auto;background:var(--chip);border-radius:16px;padding:8px 12px}
.log div{padding:4px 0;border-bottom:1px dashed var(--line);word-break:break-all}
.log b{color:var(--accent)}
.empty{color:var(--sub);text-align:center;padding:16px 0;margin:0}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0}
.switch input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.kakao{background:#FEE500;color:#191600}
.plan{display:block;width:100%;text-align:left;background:var(--chip);border:2px solid var(--line);border-radius:20px;padding:14px 16px;margin-top:10px;color:var(--ink);font:inherit;cursor:pointer}
.plan[aria-pressed="true"]{border-color:var(--accent)}
.plan b{font-size:1.1rem}
.plan .badge{float:right;background:var(--accent);color:var(--accent-ink);font-size:.75rem;border-radius:999px;padding:2px 8px;font-weight:700}
.phrase{padding:12px 0;border-bottom:1px solid var(--line)}
.phrase:last-child{border-bottom:0}
.phrase .old{color:var(--sub);margin:0;text-decoration:line-through;text-decoration-thickness:1px}
.phrase .new{font-weight:700;margin:2px 0 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
body.full nav{display:none}
nav .wrap{max-width:500px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{background:none;border:0;color:var(--ink);font:inherit;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0}
nav .ic{width:64px;height:34px;border-radius:999px;display:grid;place-items:center}
nav button[aria-current="page"]{color:var(--accent)}
nav button[aria-current="page"] .ic{background:var(--card)}
nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.cont{background:var(--chip);border:1.5px solid var(--line);border-radius:18px;padding:12px 16px;margin:0 0 18px;font-size:.95rem}
.cont b{display:block;color:var(--accent);font-size:.85rem;margin-bottom:2px}
.thread{margin-top:14px}
.thread .q{border:0;padding:8px 0 2px;font-weight:600;margin:0}
.thread .a{margin:0 0 6px;padding:10px 14px;background:var(--chip);border-radius:16px}
.ask{display:flex;gap:8px;margin-top:10px}
.ask input{flex:1}
.ask button{flex:none;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:0 18px;cursor:pointer}
.ask button:disabled{background:var(--soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>

 {id:"C18",area:"세대 비교",title:"비교의 역효과",text:"‘누구는’ 식의 비교는 지금 아이들에게 자존감 공격으로 받아들여진다.",trait:"비교하지 않을 때 편안해해요"},

 {id:"P2",cat:"성적·진로",old:"누구는 몇 점이라던데.",new:"이번에 제일 신경 쓴 과목이 뭐였어?"},
 {id:"P11",cat:"성적·진로",old:"그거 해서 뭐 먹고 살래?",new:"그게 왜 좋아? 더 듣고 싶다."},

const iso = d => { const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
const today = () => iso(new Date());
const ago = n => iso(new Date(Date.now()-n*86400000));
const daysBetween = (a,b) => Math.round((new Date(b)-new Date(a))/86400000);
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove("show"),1900); }

const trialLeft = () => !S.trialStart ? 7 : Math.max(0, 7 - daysBetween(S.trialStart, today()));
const canUse = () => S.subscribed || trialLeft() > 0;

/* ============ AI (claude.ai 안에서는 실제 AI, 밖에서는 데모 응답) ============ */
let sample = null, dictation = null;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!window.claude?.use && SR) {
  let rec=null; const st=[], fin=[];
  dictation = {
    onFinal:f=>{fin.length=0; fin.push(f);}, onState:f=>{st.length=0; st.push(f);},
    start:()=>new Promise((res,rej)=>{ try{
      rec=new SR(); rec.lang="ko-KR"; rec.interimResults=false;
      rec.onresult=e=>fin.forEach(f=>f({text:e.results[e.results.length-1][0].transcript}));
      rec.onend=()=>{ rec=null; st.forEach(f=>f({state:"idle"})); };
      rec.onerror=()=>{ rec=null; st.forEach(f=>f({state:"idle"})); };
      rec.start(); st.forEach(f=>f({state:"listening"})); res();
    }catch(e){ rej(e); } }),
    stop:()=>{ rec?.stop(); }
  };
}
if (window.claude?.use) {
  claude.use("sample").then(s=>{ sample=s; });
  claude.use("dictation").then(d=>{ dictation=d; const v=$("#voice"); if(v&&d){ v.hidden=false; bindVoice(); } });
}
async function ask(prompt, fallback){
  if (sample) {
    try { return {data: await sample.json(prompt, {modelTier:"default"}), source:"ai"}; } catch {}
  }
  try {
    const ctl = new AbortController(); const timer = setTimeout(()=>ctl.abort(), 25000);
    const r = await fetch("/api/ai", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({prompt}), signal:ctl.signal});
    clearTimeout(timer);
    if (r.ok) { const j = await r.json(); if (j && j.data) return {data:j.data, source:"ai"}; }
  } catch {}
  return {data:fallback(), source:"demo"};
}

function bindVoice(){
  const btn=$("#voice"), t=$("#sit"); if(!btn||!t) return;
  let on=false;
  dictation.onFinal(({text})=>{ const ta=$("#sit"); if(!ta) return; ta.value=(ta.value+" "+text).trim(); ta.dispatchEvent(new Event("input")); });
  dictation.onState(({state})=>{ on=state==="listening"; const b=$("#voice"); if(b){ b.dataset.on=on; b.textContent=on?"듣고 있어요. 누르면 멈춰요":"음성으로 말하기"; } });
  btn.onclick=()=>{ if(on){ dictation.stop(); return; } dictation.start().catch(()=>toast("음성 입력을 쓸 수 없어요. 글로 적어 주세요")); track("voice_input_start"); };
}

async function analyze(text){
  if (text.length<5) return;
  if (!canUse()){ track("paywall_open",{from:"consult_blocked"}); go("paywall"); return; }
  track("consult_submit",{length_bucket:text.length<50?"short":text.length<200?"medium":"long", has_prev_result:!!S.records.find(r=>r.result)});
  if (localCrisis(text)) return go("crisis",{text, type:"keyword"});
  document.body.classList.add("full");
  app.innerHTML = `<div class="loading"><span class="dot"></span>${esc(kid())}의 마음을 살펴보고 있어요</div>`;
  const t0=performance.now();
  const {data:a, source} = await ask(analysisPrompt(text), ()=>demoAnalysis(text));
  if (a.crisis && a.crisis!=="none") return go("crisis",{text, type:a.crisis});
  const rec = makeRec(a, text, null), card = CARDS.find(c=>c.id===rec.card);
  track("analysis_shown",{source, card_id:card.id, card_area:card.area, signal:rec.signal, latency_ms:Math.round(performance.now()-t0)});
  go("analysis", rec);
}
function makeRec(a, situation, followOf){
  const card = CARDS.find(c=>c.id===a.card) || CARDS[5];
  const rec = {id:Date.now(), date:today(), situation, followOf, continuity:a.continuity||"", signal:a.signal||"green", signalReason:a.signal_reason||"", empathy:a.empathy, inner:a.inner||[], avoid:a.avoid, instead:a.instead||a.example, card:card.id, mission:a.action, example:a.example, result:null, memo:"", status:"new", thread:[]};
  S.records.unshift(rec); markActive(); save(); return rec;
}
async function nextStep(r){
  if (!canUse()){ track("paywall_open",{from:"next_step_blocked"}); go("paywall"); return; }
  track("next_step_request",{prev_result:r.result, card_id:r.card});
  document.body.classList.add("full");
  app.innerHTML = `<div class="loading"><span class="dot"></span>지난 결과를 반영하고 있어요</div>`;
  const {data:a, source} = await ask(nextPrompt(r), ()=>demoNext(r));
  if (a.crisis && a.crisis!=="none") return go("crisis",{text:r.memo||r.situation, type:a.crisis});
  const rec = makeRec(a, r.situation, r.id);
  track("analysis_shown",{source, card_id:rec.card, signal:rec.signal, follow_up:true});
  go("analysis", rec);
}

[이전 상담 기록]
${historyText(rec.id)}
[이 상담에서 이미 나눈 질문]

function demoFollow(rec, q){
  if (/안\s?받|무시|대답.*없|반응.*없/.test(q)) return {crisis:"none",answer:"반응이 없어도 괜찮아요. 사춘기 아이는 부모의 시도를 받아들이는 데 시간이 걸려요. 같은 방식으로 두세 번 더 해 보시고, 그래도 어렵다면 결과에 ‘어려웠어요’를 남겨 주세요. 더 부담 없는 방법으로 바꿔 드릴게요."};
  if (/아빠|남편|배우자/.test(q)) return {crisis:"none",answer:"두 분이 같은 방식으로 반응하는 게 중요해요. 오늘 제안한 문장을 배우자분께도 공유해 주시고, 당분간 한 사람은 규칙, 한 사람은 정서적 지지처럼 역할을 나누지 말고 같은 톤을 유지해 보세요."};
  return {crisis:"none",answer:`좋은 질문이에요. 핵심은 “${rec.mission}”을 할 때 대답이나 변화를 바로 기대하지 않는 거예요. 아이가 부담을 느끼지 않는 것이 이번 단계의 목표예요.`};
}

function buildManual(){
  const done=S.records.filter(r=>r.result);
  const score={}; done.forEach(r=>{ score[r.card]=score[r.card]||{good:0,hard:0}; if(r.result==="좋았어요") score[r.card].good++; if(r.result==="어려웠어요") score[r.card].hard++; });
  const goods=Object.entries(score).filter(([,v])=>v.good>0).sort((a,b)=>b[1].good-a[1].good).slice(0,3).map(([id])=>CARDS.find(c=>c.id===id)?.trait).filter(Boolean);
  const hardRec=done.find(r=>r.result==="어려웠어요");
  return {count:done.length, goods, hard: hardRec ? (hardRec.memo ? `“${hardRec.memo}” 같은 반응이 있었어요. 갈등 직후 직접 다가가는 건 아직 어려워해요` : "갈등 직후 직접 다가가는 건 아직 어려워해요") : null};
}
let childSeg="records";
function renderChild(){
  const m=buildManual(), wk=ago(6);
  const week=S.records.filter(r=>r.result && r.resultDate>=wk), good=week.filter(r=>r.result==="좋았어요").length;
  const c=S.checks, first=c[0], last=c[c.length-1];
  let change="";
  if (c.length>1){ const pct=Math.round((last.score-first.score)/first.score*100); change = pct<0 ? `처음보다 마음의 부담이 ${-pct}% 가벼워졌어요.` : `처음보다 마음의 부담이 ${pct}% 늘었어요. 혼자 버티지 마세요.`; }
  else if (week.length) change = `이번 주 ${week.length}번 시도해서 ${good}번 좋은 반응이 있었어요.`;
  app.innerHTML = `
    <h1>기록</h1><p class="lead">아이와 나, 둘의 변화를 모아 봤어요.</p>
    <div class="card">
      <h2>${esc(kid())} 사용설명서</h2>
      ${m.count>=3 && m.goods.length ? `<ul class="manual" style="margin:0;padding-left:20px">${m.goods.map(g=>`<li>${esc(g)}</li>`).join("")}${m.hard?`<li class="hard">${esc(m.hard)}</li>`:""}</ul>
        <p class="label" style="margin:10px 0 0">결과 ${m.count}개를 바탕으로 정리했어요. 기록할수록 정확해져요.</p>`
      : `<p style="margin:0">미션 결과를 3번 기록하면 우리 아이에게 무엇이 통하는지 정리해 드려요.</p><div class="progress"><span style="width:${Math.min(100,m.count/3*100)}%"></span></div><p class="label" style="margin:6px 0 0">${m.count} / 3</p>`}
    </div>
    <div class="card">
      <h2>이번 주</h2>
      <p style="margin:0">${esc(change || "아직 이번 주 기록이 없어요.")}</p>
      <div class="stat"><div><b>${streak()}</b><span>연속 실천</span></div><div><b>${week.length}</b><span>해 본 미션</span></div><div><b>${week.length?Math.round(good/week.length*100)+"%":"–"}</b><span>좋은 반응</span></div></div>
    </div>
    <div class="card">
      <h2>내 마음 점검</h2>
      ${c.length ? `<p style="margin:0">최근 점검 ${last.date.slice(5).replace("-","월 ")}일 · 부담 점수 ${last.score.toFixed(1)}점${c.length>1?` (처음 ${first.score.toFixed(1)}점)`:""}</p>
        <p class="label" style="margin:4px 0 0">1~5점, 낮을수록 마음이 가벼워요. 일주일에 한 번 점검하면 변화를 보여 드려요.</p>`
      : `<p style="margin:0">지금 마음 상태를 기록해 두면, 앞으로 얼마나 가벼워지는지 비교해 드려요.</p>`}
      <button class="btn ${checkDue()?"primary":"ghost"} small" id="toCheck">${!c.length?"처음 마음 기록하기":checkDue()?"이번 주 마음 점검하기":"다시 점검하기"}</button>
    </div>
    <div class="seg" role="tablist">
      <button role="tab" aria-selected="${childSeg==="records"}" data-s="records">상담 기록</button>
      <button role="tab" aria-selected="${childSeg==="phrases"}" data-s="phrases">저장한 문장</button>
    </div>
    <div id="segBody"></div>`;
  $("#toCheck")?.addEventListener("click",()=>{ track("check_open",{from:"child"}); go("check"); });
  app.querySelector(".seg").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; childSeg=b.dataset.s; track("child_segment",{segment:childSeg}); renderChild(); };
  const body=$("#segBody");
  if (childSeg==="records"){
    body.innerHTML = S.records.length ? S.records.map(r=> r.crisis
      ? `<div class="rec"><p class="date">${r.date}</p><p>${esc(r.situation)}</p><span class="tag red">전문기관 안내</span></div>`
      : `<div class="rec" data-open="${r.id}" style="cursor:pointer"><p class="date">${r.date}</p><p>${esc(r.situation)}</p><p style="color:var(--sub);font-size:.93rem">→ ${esc(r.mission)}</p>${r.followOf?`<span class="tag">이어진 상담</span>`:""}${(r.thread||[]).length?`<span class="tag">추가 질문 ${r.thread.length}</span>`:""}
          <span class="tag">${esc(r.result || (r.status==="accepted"?"해 보는 중":"하지 않음"))}</span>${r.memo?`<span class="tag">${esc(r.memo)}</span>`:""}</div>`).join("")
      : `<p class="empty">아직 기록이 없어요. 오늘 탭에서 있었던 일을 말해 보세요.</p>`;
    body.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>{ const r=S.records.find(x=>String(x.id)===el.dataset.open); if(r && r.empathy){ track("record_open"); go("analysis",r); } else toast("예시 데이터는 상세 내용이 없어요"); });
  } else {
    const savedList=S.saved.map(s=>typeof s==="string"?PHRASES.find(p=>p.id===s):s).filter(Boolean);
    const rec=PHRASES.filter(p=>S.profile.concerns.includes(p.cat) && !S.saved.includes(p.id)).slice(0,3);
    const recList = rec.length? rec : PHRASES.filter(p=>!S.saved.includes(p.id)).slice(0,3);
    body.innerHTML = (savedList.length? savedList.map(p=>`<div class="phrase"><p class="old">${esc(p.old)}</p><p class="new">${esc(p.new)}</p></div>`).join("")
      : `<p class="empty" style="padding-bottom:4px">분석에서 ‘문장 저장’을 누르면 여기에 모여요.</p>`)
      + (recList.length? `<p class="label" style="margin-top:18px">${esc(kid())} 부모님께 추천하는 문장</p>` + recList.map(p=>`<div class="phrase"><p class="old">${esc(p.old)}</p><p class="new">${esc(p.new)}</p><button class="link accent" data-add="${p.id}" style="padding:4px 0 0">저장</button></div>`).join("") : "");
    body.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{ S.saved.push(b.dataset.add); save(); track("phrase_save",{source:"recommend", phrase_id:b.dataset.add}); renderChild(); });
  }
}

/* ============ 주간 마음 점검 (불안 6문항 + 갈등 횟수 2개) ============ */
function renderCheck(){
  const ans=Array(6).fill(null), cnt={talkFirst:0, yelled:0};
  app.innerHTML = `<h1>이번 주 마음 점검</h1><p class="lead">지난 일주일을 떠올리며 답해 주세요. 변화를 숫자로 보여 드려요.</p>
    <div class="card" style="padding:6px 20px">
      <div class="counter"><span>아이가 먼저 말을 건 횟수</span><div class="ctl"><button data-k="talkFirst" data-d="-1" aria-label="줄이기">−</button><b id="talkFirst">0</b><button data-k="talkFirst" data-d="1" aria-label="늘리기">+</button></div></div>
      <div class="counter" style="border:0"><span>언성이 높아진 횟수</span><div class="ctl"><button data-k="yelled" data-d="-1" aria-label="줄이기">−</button><b id="yelled">0</b><button data-k="yelled" data-d="1" aria-label="늘리기">+</button></div></div>
    </div>
    <div class="card" style="padding:6px 20px">${ANX_Q.map((q,i)=>`<div class="q"><p>${q}</p><div class="mood" data-q="${i}"></div><div class="scale"><span>전혀 아니다</span><span>매우 그렇다</span></div></div>`).join("")}</div>
    <button class="btn primary" id="done" disabled>저장하기</button>
    <div class="center"><button class="link" id="cancel">다음에 할게요</button></div>`;
  app.querySelectorAll(".counter button").forEach(b=>b.onclick=()=>{ const k=b.dataset.k; cnt[k]=Math.max(0,cnt[k]+(+b.dataset.d)); $("#"+k).textContent=cnt[k]; });
  app.querySelectorAll("[data-q]").forEach(el=>moodRow(el,m=>{ ans[+el.dataset.q]=m; $("#done").disabled=ans.some(a=>a===null); }));
  $("#done").onclick=()=>{
    const score=+(ans.reduce((a,b)=>a+b,0)/6).toFixed(2);
    S.checks.push({date:today(), score, ...cnt}); save();
    track("weekly_check",{anxiety_score:score, talk_first:cnt.talkFirst, yelled:cnt.yelled, nth:S.checks.length});
    toast("저장했어요"); go("child");
  };
  $("#cancel").onclick=()=>go("today");
}

/* ============ 구독 (결제 흉내) ============ */
let pickedPlan="yearly";
function renderPaywall(){
  app.innerHTML = `<button class="link" id="close">닫기</button>
    <h1 style="margin-top:10px">계속 함께할게요</h1>
    <p class="lead">상담 한 번 비용의 5분의 1로, 한 달 내내.</p>
    <button class="plan" data-p="yearly" aria-pressed="${pickedPlan==="yearly"}"><span class="badge">2개월 무료</span><b>연간 99,000원</b><br><span style="color:var(--sub);font-size:.9rem">월 8,250원꼴</span></button>
    <button class="plan" data-p="monthly" aria-pressed="${pickedPlan==="monthly"}"><b>월간 9,900원</b><br><span style="color:var(--sub);font-size:.9rem">언제든 해지할 수 있어요</span></button>
    <button class="btn primary" id="buy">구독 시작하기</button>
    <p class="label" style="margin-top:14px">위기 상황 안내는 구독과 관계없이 항상 무료예요. 프로토타입이라 실제 결제는 되지 않아요.</p>`;
  app.querySelectorAll(".plan").forEach(b=>b.onclick=()=>{ pickedPlan=b.dataset.p; track("plan_select",{plan:pickedPlan}); renderPaywall(); });
  $("#close").onclick=()=>{ track("paywall_close"); go("today"); };
  $("#buy").onclick=()=>{
    const value=pickedPlan==="yearly"?99000:9900;
    track("begin_checkout",{plan:pickedPlan, value, currency:"KRW"});
    S.subscribed=true; S.plan=pickedPlan; save();
    track("purchase",{plan:pickedPlan, value, currency:"KRW", simulated:true});
    toast("구독이 시작됐어요"); go("today");
  };
}

/* ============ 마이 ============ */
function renderMy(){
  const left=trialLeft();
  app.innerHTML = `<h1>마이</h1><p class="lead">${esc(kid())} 부모님</p>
    <div class="card">
      <div class="switch"><span>${esc(S.profile.grade)} · ${esc(S.profile.gender)}<br><span class="label">${esc(S.profile.concerns.join(", ")||"고민 선택 안 함")}</span></span><button class="link accent" id="edit">수정</button></div>
      <div class="switch" style="border-top:1px solid var(--line)"><span>${S.subscribed?`${S.plan==="yearly"?"연간":"월간"} 구독 중`:left>0?`무료 체험 ${left}일 남음`:"무료 체험 종료"}</span>${S.subscribed?`<button class="link" id="cancelSub">해지</button>`:`<button class="link accent" id="pay">구독 보기</button>`}</div>
    </div>
    <div class="card">
      <h2>알림</h2>
      <label class="switch"><span>저녁 8시에 미션 결과 묻기</span><input type="checkbox" id="ne" ${S.notif.evening?"checked":""}></label>
      <label class="switch"><span>시험·방학 2주 전 미리 알려 주기</span><input type="checkbox" id="ns" ${S.notif.season?"checked":""}></label>
    </div>
    <details class="card" style="margin-top:0"><summary style="font-size:1rem;color:var(--ink);font-weight:700">발표용 도구</summary>
      <p class="label" style="margin-top:12px" id="gaStatus"></p>
      <div class="log" id="eventLog"></div>
      <button class="btn ghost small" id="seed">2주치 예시 데이터 채우기</button>
      <button class="btn ghost small" id="endTrial">체험 종료 상태로 보기</button>
      <button class="btn ghost small" id="reset">처음부터 다시</button>
    </details>`;
  renderLog();
  $("#edit").onclick=()=>{ ob={step:1, grade:S.profile.grade, gender:S.profile.gender, concerns:[...S.profile.concerns], consent:true}; S.profile=null; go("onboarding"); };
  $("#pay")?.addEventListener("click",()=>{ track("paywall_open",{from:"my"}); go("paywall"); });
  $("#cancelSub")?.addEventListener("click",()=>{ S.subscribed=false; save(); track("subscription_cancel",{simulated:true}); renderMy(); });
  $("#ne").onchange=e=>{ S.notif.evening=e.target.checked; save(); track("notification_toggle",{type:"evening", on:e.target.checked}); };
  $("#ns").onchange=e=>{ S.notif.season=e.target.checked; save(); track("notification_toggle",{type:"season", on:e.target.checked}); };
  $("#seed").onclick=()=>{ seedDemo(); track("demo_seed"); toast("예시 데이터를 채웠어요. 기록 탭을 보세요"); };
  $("#endTrial").onclick=()=>{ S.subscribed=false; S.trialStart=ago(8); save(); track("demo_trial_end"); toast("체험 종료 상태예요"); renderMy(); };
  $("#reset").onclick=()=>{ S=blank(); ob={step:1,grade:null,gender:null,concerns:[],consent:false}; save(); track("data_reset"); go("onboarding"); };
}
function renderLog(){
  const st=$("#gaStatus"), el=$("#eventLog"); if(!st||!el) return;
  st.textContent = typeof window.gtag==="function" ? "Google Analytics 연결됨: 아래 이벤트가 전송되고 있어요." : "Google Analytics 미연결: 직접 배포해 측정 ID를 넣으면 아래 이벤트가 GA로 전송돼요. 아이에 관한 글 내용은 보내지 않아요.";
  el.innerHTML = events.length? events.slice(0,50).map(e=>`<div><b>${e.name}</b> ${esc(JSON.stringify(e.params))}</div>`).join("") : `<p class="empty">아직 이벤트가 없어요.</p>`;
}
function seedDemo(){
  const items=[
    [13,"성적표를 안 보여주고 방문을 닫았어요","저녁에 간식을 건네며 성적 말고 다른 얘기 한마디 하기","어려웠어요","방문을 안 열어줬어요","C2"],
    [12,"어제 일 때문에 아침에도 말을 안 해요","문자로 ‘오늘도 고생했어’ 한 줄 보내기","좋았어요","‘응’이라고 답장 왔어요","C12"],
    [10,"폰 때문에 또 언성이 높아졌어요","주말에 폰 규칙을 같이 정하자고 제안하기","좋았어요","10시까지로 스스로 정했어요","C13"],
    [8,"학원 끝나고 연락 없이 늦게 왔어요","걱정했던 마음을 ‘나는’으로 말하기","그저 그랬어요","알았다고만 했어요","C7"],
    [6,"진로 얘기를 꺼냈다가 짜증을 냈어요","쪽지로 응원 한 줄 남기기","좋았어요","쪽지를 책상에 붙여 뒀어요","C12"],
    [4,"시험 기간이라 예민해요","간식 챙겨 주며 컨디션만 묻기","좋았어요","고맙다고 했어요","C14"],
    [2,"방 정리 때문에 부딪혔어요","언제 정리할지 아이가 정하게 하기","좋았어요","토요일에 하겠대요","C13"]
  ];
  S.records = items.map(([d,sit,m,res,memo,c],i)=>({id:Date.now()-d*86400000+i, date:ago(d), resultDate:ago(Math.max(0,d-1)), situation:sit, signal:"green", card:c, mission:m, result:res, memo, status:"accepted"})).reverse().reverse();
  S.records.sort((a,b)=>b.id-a.id);
  S.active=[...new Set([13,12,11,10,8,7,6,5,4,3,2,1].map(ago))];
  S.checks=[{date:ago(14),score:3.83,talkFirst:1,yelled:4},{date:ago(7),score:3.33,talkFirst:2,yelled:2},{date:today(),score:2.83,talkFirst:3,yelled:1}];
  S.saved=["P1","P8"]; save();
}

if ("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("/sw.js").catch(()=>{});
/* 시작 */
go(S.profile ? "today" : "onboarding");
